name: Mesa CLICK — CI

on:
  push:
    branches: [ main, master, qa ]
  pull_request:
    branches: [ main, master, qa ]

jobs:
  backend-test:
    name: Backend Tests & Migrations
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_pass
          POSTGRES_DB: mesa_click_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: repos/api/go.mod

      - name: Build and run backend tests
        env:
          DATABASE_URL: postgres://postgres:postgres_pass@localhost:5432/mesa_click_test?sslmode=disable
          JWT_SECRET: test_jwt_secret_for_ci_pipeline_env
          APP_ENV: testing
        run: |
          cd repos/api
          go test -v ./...

  frontend-build:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies, lint & build frontend
        run: |
          cd repos/web
          npm ci
          npm run lint
          npm run build
